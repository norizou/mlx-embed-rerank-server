[project]
name = "mlx-embed-rerank-server"
version = "1.0.0"
description = "MLX-based embedding and reranking API server for Japanese and multilingual RAG"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "mlx",
    "mlx-embeddings",
    "mlx-lm",
    "mlx-audio>=0.5.1",
    # embeddinggemma-2 (model_type embedding_gemma2) is only in mlx-vlm main as of 2026-11;
    # pinned to the revision the mlx-community weights were converted with (validation.json).
    "mlx-vlm @ https://github.com/Blaizzy/mlx-vlm/archive/3d87e88402f307efbf68e568971aa887ee7d9ed0.tar.gz",
    "python-multipart",
    "numpy",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short --strict-markers"
markers = [
    "vl: requires the Qwen3-VL models (needs torch/torchvision)",
    "audio: exercises the STT/TTS endpoints (slow, loads audio models)",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]



